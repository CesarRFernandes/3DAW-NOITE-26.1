<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar senha — EcoEscambo</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="pagina-central">
  <div class="card">

    <div class="logo">
      <a href="login.html">
        <img src="../image/ecoescambo.png" alt="EcoEscambo" />
      </a>
    </div>

    <h1 class="titulo-secao">Recuperar senha</h1>
    <p class="subtitulo-secao">
      Informe seu e-mail para receber o link de redefinição
    </p>

    <form id="form-recuperar" novalidate>

      <div class="grupo-campo">
        <label for="email">E-mail cadastrado</label>
        <input type="email" id="email" name="email"
               placeholder="seu@email.com" autocomplete="email" />
        <span class="msg-erro" id="email-erro"></span>
      </div>

      <button class="btn btn-primario" type="submit"
              id="btn-recuperar" disabled>
        Enviar link de recuperação
      </button>

    </form>

    <div class="alerta alerta-sucesso" id="aviso-enviado">
      <span>&#10003;</span>
      <span>
        Link enviado! Verifique sua caixa de entrada.<br />
        <a href="nova-senha.html">Redefinir senha (simulação) &rarr;</a>
      </span>
    </div>

    <div class="divider"></div>
    <div class="links-extras">
      <a href="login.html">&larr; Voltar ao login</a>
      &nbsp;&middot;&nbsp;
      <a href="cadastro.html">Criar conta</a>
    </div>

  </div>
</div>

<script src="../js/validacao.js"></script>
<script>initRecuperarSenha();</script>
</body>
</html>
