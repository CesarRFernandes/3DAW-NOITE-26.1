<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - EcoEscambo</title>
    </head>

    <body>
        <div class="container">
            <div class="logo">
                <a href="cadastro.html">
                    <img src="../image/ecoescambo.png" alt="LogoEcoEscambo">
                </a>
            </div>

            <!--area de login-->
            <h3>Login</h3>
            <form id="form-login">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required/>

                <label for="password">Senha</label>
                <input type="password" id="senha" name="senha" required/>

                <button class="btn" type="submit">Entrar</button>
            </form>

            <div class="esqueceu-senha">
                <a href="recuperar-senha.html">Esqueci minha senha</a>
            </div>

            <div class="button-cadastro">Ainda não sou usuário <a href="cadastro.html">Cadastre-se</a>
            </div>
        </div>
    </body>
</html>
