<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - EcoEscambo</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
      .campo-senha-wrap { position: relative; display: flex; align-items: center; }
      .campo-senha-wrap input { flex: 1; padding-right: 44px; }
      .eye-btn { position: absolute; right: 10px; background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; }
      .eye-icon { width: 22px; height: 22px; opacity: 0.5; }
      .eye-btn:hover .eye-icon { opacity: 0.9; }
    </style>
</head>
<body>
<div class="pagina-central">
<div class="card">

    <div class="logo">
    <a href="explorar.html">
        <img src="../image/ecoescambo.png" alt="EcoEscambo" />
    </a>
    </div>

    <h1 class="titulo-secao">Entrar</h1>
    <p class="subtitulo-secao">Acesse sua conta para começar a trocar</p>

    <form id="form-login" novalidate>

    <div class="grupo-campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" />
        <span class="msg-erro" id="email-erro"></span>
    </div>

    <div class="grupo-campo">
        <label for="senha">Senha</label>
        <div class="campo-senha-wrap">
          <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" />
          <button class="eye-btn" type="button" aria-label="Mostrar/ocultar senha">
            <img class="eye-icon" src="https://img.icons8.com/ios-glyphs/30/000000/invisible.png" alt="olho" />
          </button>
        </div>
    </div>

    <div style="text-align: right; margin-bottom: 20px;">
        <a href="recuperar-senha.html" style="font-size: 0.85rem;">Esqueci minha senha</a>
    </div>

    <button class="btn btn-primario" type="submit" id="btn-entrar" disabled>Entrar no sistema</button>

    </form>

    <div class="divider"></div>

    <div class="links-extras">Ainda não tem conta?<a href="cadastro.html">Cadastre-se</a>
    </div>

</div>
</div>

    <script src="../js/eco-db.js"></script>
    <script>if (window.EcoDB) EcoDB.ensureSeed();</script>
    <script src="../js/validacao.js"></script>
    <script>initLogin();</script>
</body>
</html>
