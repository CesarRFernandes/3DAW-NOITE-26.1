<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - EcoEscambo</title>
    </head>

    <body>
    <div class="pagina-central">
    <div class="card">

        <div class="logo">
        <a href="explorar.html">
            <img src="../image/ecoescambo.png" alt="EcoEscambo" />
        </a>
        </div>

        <h1 class="titulo-secao">Entrar</h1>
        <p class="subtitulo-secao">Acesse sua conta para começar a trocar</p>

        <form id="form-login" novalidate>

        <div class="grupo-campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" />
            <span class="msg-erro" id="email-erro"></span>
        </div>

        <div class="grupo-campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" />
        </div>

        <div style="text-align: right; margin-bottom: 20px;">
            <a href="recuperar-senha.html" style="font-size: 0.85rem;">Esqueci minha senha</a>
        </div>

        <button class="btn btn-primario" type="submit" id="btn-entrar" disabled>Entrar</button>

        </form>

        <div class="divider"></div>

        <div class="links-extras">Ainda não tem conta?<a href="cadastro.html">Cadastre-se</a>
        </div>

    </div>
    </div>

    <script src="../js/validacao.js"></script>
    <script>initCadastro();</script>
</body>
</html>
