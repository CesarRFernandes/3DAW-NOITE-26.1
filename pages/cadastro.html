<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
      .campo-senha-wrap { position: relative; display: flex; align-items: center; }
      .campo-senha-wrap input { flex: 1; padding-right: 44px; }
      .eye-btn { position: absolute; right: 10px; background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; }
      .eye-icon { width: 22px; height: 22px; opacity: 0.5; }
      .eye-btn:hover .eye-icon { opacity: 0.9; }
    </style>
</head>
<body>
<div class="pagina-central">
<div class="card">

    <div class="logo">
    <a href="login.html">
        <img src="../image/ecoescambo.png" alt="EcoEscambo" />
    </a>
    </div>

    <h1 class="titulo-secao">Criar conta</h1>
    <p class="subtitulo-secao">Junte-se à comunidade de trocas ecológicas</p>

    <form id="form-cadastro" novalidate>

    <div class="grupo-campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" />
        <span class="msg-erro" id="email-erro"></span>
    </div>

    <div class="grupo-campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Como quer ser chamado(a)" autocomplete="name" />
        <span class="msg-erro" id="nome-erro"></span>
    </div>

    <div class="grupo-campo">
        <label for="senha">Senha</label>
        <div class="campo-senha-wrap">
          <input type="password" id="senha" name="senha" placeholder="Crie uma senha segura" autocomplete="new-password" />
          <button class="eye-btn" type="button" aria-label="Mostrar/ocultar senha">
            <img class="eye-icon" src="https://img.icons8.com/ios-glyphs/30/000000/invisible.png" alt="olho" />
          </button>
        </div>
        <div class="forca-senha">
        <div class="forca-barra">
            <div class="forca-progresso" id="forca-progresso"></div>
        </div>
        <span class="forca-texto" id="forca-texto"></span>
        </div>
        <span class="msg-dica">Mínimo 6 caracteres, letras maiúsculas, minúsculas e números.</span>
        <span class="msg-erro" id="senha-erro"></span>
    </div>

    <div class="grupo-campo">
        <label for="senha-conf">Confirmar senha</label>
        <div class="campo-senha-wrap">
          <input type="password" id="senha-conf" name="senha-conf" placeholder="Repita a senha" autocomplete="new-password" />
          <button class="eye-btn" type="button" aria-label="Mostrar/ocultar confirmação de senha">
            <img class="eye-icon" src="https://img.icons8.com/ios-glyphs/30/000000/invisible.png" alt="olho" />
          </button>
        </div>
        <span class="msg-erro" id="conf-erro"></span>
    </div>

    <button class="btn btn-primario" type="submit" id="btn-cadastrar" disabled>
        Cadastrar
    </button>

    </form>

    <div id="cadastro-sucesso" class="alerta alerta-sucesso" style="display:none;margin-top:18px;">
      <span>&#10003;</span>
      <span id="cadastro-sucesso-texto"></span>
    </div>

    <div class="divider"></div>

    <div class="links-extras">Já tem conta?<a href="login.html">Entrar</a>
    </div>

</div>
</div>

    <script src="../js/eco-db.js"></script>
    <script>if (window.EcoDB) EcoDB.ensureSeed();</script>
    <script src="../js/validacao.js"></script>
    <script>initCadastro();</script>
</body>
</html>
