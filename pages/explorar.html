<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explorar — EcoEscambo</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
      .card-produto-imagem img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 6px 6px 0 0;
      }
      .card-produto-imagem { font-size: 0; overflow: hidden; }
    </style>
</head>
<body>

    <nav class="navbar">
    <a href="explorar.html" class="navbar-logo">
        <img src="../image/ecoescambo.png" alt="EcoEscambo" />
    </a>
    <ul class="navbar-nav">
        <li><a href="explorar.html" class="ativo">Explorar</a></li>
        <li><a href="meus-produtos.html">Meus produtos</a></li>
        <li><a href="propostas.html">Propostas</a></li>
    </ul>
    <div class="navbar-usuario">
        <img src="../image/icone.png" alt="Usuário" style="width:36px; height:36px; border-radius:50%; object-fit:cover;" />
        <span id="navbar-nome" style="font-size:0.85rem;"></span>
        <a href="#" id="btn-sair" style="color: rgba(255,255,255,0.7); font-size:0.8rem; margin-left:8px;">Sair</a>
    </div>
    </nav>

    <div class="conteudo">

    <div class="cabecalho-pagina">
        <h1>Explorar produtos</h1>
        <a href="cadastro-produto.html" class="btn btn-primario" style="width:auto; padding: 10px 20px;">+ Ofertar produto</a>
    </div>

    <div class="barra-filtros">
        <div class="campo-busca">
        <span class="icone-busca">&#128269;</span>
        <input type="text" placeholder="Buscar produto..." />
        </div>
        <select style="width: auto;">
        <option>Todas as categorias</option>
        <option>Eletrônicos</option>
        <option>Livros</option>
        </select>
    </div>

    <div id="grid-produtos" class="grade-produtos"></div>
    <div id="paginacao" class="paginacao"></div>

    </div>

    <script src="../js/eco-db.js"></script>
    <script src="../js/eco-auth.js"></script>
    <script src="../js/eco-t2.js"></script>
    <script>
      EcoDB.ensureSeed();
      EcoAuth.initNavbar();
      EcoT2.initExplorar();
    </script>
</body>
</html>
